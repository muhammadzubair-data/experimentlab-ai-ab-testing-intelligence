<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Arial, sans-serif">
<rect width="1200" height="300" rx="22" fill="#081329"/>
<text x="40" y="44" font-size="20" font-weight="800" fill="#F8FAFC">ExperimentLab AI · from raw export to an honest reading</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs>
<g font-size="13" fill="#E2E8F0">
<rect x="40" y="74" width="200" height="180" rx="14" fill="#10264A" stroke="#0EA5B7"/>
<text x="58" y="102" font-weight="800" fill="#22D3EE">1 · Data</text><text x="58" y="130">Original v1 demo, scenario</text><text x="58" y="150">builder or CSV upload</text><text x="58" y="180">prepare(): aliases, yes/no,</text><text x="58" y="200">duplicates, cross-arm users,</text><text x="58" y="220">segments, timestamps, report</text>
<rect x="276" y="74" width="210" height="180" rx="14" fill="#10264A" stroke="#F59E0B"/>
<text x="294" y="102" font-weight="800" fill="#FBBF24">2 · Comparison</text><text x="294" y="130">Wilson rates · z-test</text><text x="294" y="150">Fisher if counts are small</text><text x="294" y="170">Newcombe + Wald + relative CI</text><text x="294" y="190">Bayesian P(better), loss</text><text x="294" y="220" fill="#34D399">verdict without overclaiming</text>
<rect x="522" y="74" width="200" height="180" rx="14" fill="#10264A" stroke="#34D399"/>
<text x="540" y="102" font-weight="800" fill="#34D399">3 · Diagnostics</text><text x="540" y="130">SRM vs planned split</text><text x="540" y="150">detectable effect (MDE)</text><text x="540" y="170">results over time</text><text x="540" y="190">peeking simulation</text>
<rect x="758" y="74" width="190" height="180" rx="14" fill="#10264A" stroke="#6366F1"/>
<text x="776" y="102" font-weight="800" fill="#A5B4FC">4 · Segments</text><text x="776" y="130">forest plot, Newcombe CIs</text><text x="776" y="150">raw + Holm p-values</text><text x="776" y="170">Cochran's Q</text><text x="776" y="200" fill="#FBBF24">exploratory only</text>
<rect x="984" y="74" width="176" height="180" rx="14" fill="#10264A" stroke="#0EA5B7"/>
<text x="1002" y="102" font-weight="800" fill="#22D3EE">5 · Plan &amp; export</text><text x="1002" y="130">sample size, ratio,</text><text x="1002" y="150">duration, Monte Carlo</text><text x="1002" y="170">power check</text><text x="1002" y="200">CSV / JSON exports</text>
</g>
<g stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"><line x1="242" y1="164" x2="272" y2="164"/><line x1="488" y1="164" x2="518" y2="164"/><line x1="724" y1="164" x2="754" y2="164"/><line x1="950" y1="164" x2="980" y2="164"/></g>
<text x="40" y="284" font-size="12.5" fill="#94A3B8">Synthetic demo by default · uploads stay in the browser session · statistical evidence, not automatic proof of causal lift</text>
</svg>
